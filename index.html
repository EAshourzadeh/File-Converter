<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Converter</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--fg:#1c1f24;--mute:#6b7280;--line:#d9dde3;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--fg:#e8eaed;--mute:#9aa1ab;--line:#2d323a;--acc:#5b8def}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{margin:0 0 20px;color:var(--mute)}
#drop{display:block;padding:36px 16px;text-align:center;border:2px dashed var(--line);border-radius:12px;background:var(--card);cursor:pointer}
#drop.over{border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:16px 0}
select,button,input[type="range"]{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
li small{color:var(--mute)}
a{color:var(--acc)}
.err{color:#dc2626}
.x{background:none;color:var(--mute);padding:0 6px;font-size:1.2rem;border:none;cursor:pointer}
.q-wrap{display:inline-flex;align-items:center;gap:6px}
.q-wrap.dim{opacity:0.4;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>File Converter</h1>
  <p class="sub">Runs entirely in your browser. Nothing is uploaded.</p>

  <label id="drop">Drop images or audio here, or click to choose
    <input id="f" type="file" multiple accept="image/*,audio/*" hidden>
  </label>

  <div class="opts">
    <label>Images to
      <select id="img"><option value="webp">webp</option><option value="png">png</option><option value="jpeg">jpeg</option></select>
    </label>
    <label>Audio to
      <select id="aud"><option value="wav">wav</option><option value="mp3">mp3</option></select>
    </label>

    <span id="qbox" class="q-wrap">
      <label for="q">Quality</label>
      <input id="q" type="range" min="40" max="100" value="90">
      <span id="qv">90</span>%
    </span>

    <button id="go" disabled>Convert</button>
    <button id="dl" class="sec" disabled>Download all</button>
    <button id="clr" class="sec" disabled>Clear</button>
  </div>

  <ul id="list"></ul>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), inp = $('#f'), list = $('#list'), go = $('#go'), clr = $('#clr'), dl = $('#dl');
let items = [];

function refresh() {
  go.disabled = !items.length;
  clr.disabled = !items.length;
  dl.disabled = !items.some(i => i.out);
}

const updateQualityVisibility = () => {
  const isPng = $('#img').value === 'png';
  $('#qbox').classList.toggle('dim', isPng);
};
$('#img').onchange = updateQualityVisibility;
$('#q').oninput = e => $('#qv').textContent = e.target.value;
updateQualityVisibility();

function add(fs) {
  [...fs].filter(f => /^(image|audio)\//.test(f.type)).forEach(file => {
    const li = document.createElement('li');
    const kb = (file.size / 1024).toFixed(0);
    li.innerHTML = `<span class="n"></span><small>${kb} KB</small><span class="st"></span><button class="x" title="Remove">×</button>`;
    li.querySelector('.n').textContent = file.name;
    const it = { file, li };
    li.querySelector('.x').onclick = () => {
      if (it.url) URL.revokeObjectURL(it.url);
      items = items.filter(i => i !== it);
      li.remove();
      refresh();
    };
    list.appendChild(li);
    items.push(it);
  });
  refresh();
}

inp.onchange = e => { add(e.target.files); inp.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
  if (ev === 'drop') add(e.dataTransfer.files);
}));

function toWav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate, len = n * ch * 2;
  const ab = new ArrayBuffer(44 + len), v = new DataView(ab);
  const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, 'RIFF'); v.setUint32(4, 36 + len, true); s(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  s(36, 'data'); v.setUint32(40, len, true);
  const d = [...Array(ch).keys()].map(i => buf.getChannelData(i));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const x = Math.max(-1, Math.min(1, d[c][i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
  }
  return new Blob([ab], { type: 'audio/wav' });
}

function toMp3(buf) {
  if (!window.lamejs) throw new Error('MP3 encoder unavailable (check connection)');
  const ch = Math.min(2, buf.numberOfChannels);
  const enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, 128);
  const to16 = a => {
    const o = new Int16Array(a.length);
    for (let i = 0; i < a.length; i++) {
      const x = Math.max(-1, Math.min(1, a[i]));
      o[i] = x < 0 ? x * 0x8000 : x * 0x7fff;
    }
    return o;
  };
  const L = to16(buf.getChannelData(0)), R = ch > 1 ? to16(buf.getChannelData(1)) : null, out = [];
  for (let i = 0; i < L.length; i += 1152) {
    const p = ch > 1 ? enc.encodeBuffer(L.subarray(i, i + 1152), R.subarray(i, i + 1152)) : enc.encodeBuffer(L.subarray(i, i + 1152));
    if (p.length > 0) out.push(p);
  }
  const e = enc.flush();
  if (e.length > 0) out.push(e);
  return new Blob(out, { type: 'audio/mpeg' });
}

async function convert(f) {
  if (f.type.startsWith('image/')) {
    const fmt = $('#img').value, q = $('#q').value / 100;
    const bmp = await createImageBitmap(f);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const x = c.getContext('2d');
    if (fmt === 'jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(bmp, 0, 0);
    const b = await new Promise(r => c.toBlob(r, 'image/' + fmt, q));
    if (!b || b.type !== 'image/' + fmt) throw new Error(fmt + ' not supported in this browser');
    return [b, fmt === 'jpeg' ? 'jpg' : fmt];
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const buf = await ctx.decodeAudioData(await f.arrayBuffer());
    return $('#aud').value === 'mp3' ? [toMp3(buf), 'mp3'] : [toWav(buf), 'wav'];
  } finally { ctx.close(); }
}

go.onclick = async () => {
  go.disabled = true; clr.disabled = true; dl.disabled = true;
  const usedNames = new Set();

  for (const it of items) {
    const st = it.li.querySelector('.st');
    st.className = 'st'; st.textContent = 'Converting…';
    try {
      const [blob, ext] = await convert(it.file);
      if (it.url) URL.revokeObjectURL(it.url);

      let baseName = it.file.name.replace(/\.[^.]+$/, '');
      let outName = `${baseName}.${ext}`;
      let counter = 1;
      while (usedNames.has(outName)) {
        outName = `${baseName} (${counter++}).${ext}`;
      }
      usedNames.add(outName);

      it.out = { blob, name: outName };
      const a = document.createElement('a');
      a.href = it.url = URL.createObjectURL(blob);
      a.download = outName;
      a.textContent = `Download .${ext} (${(blob.size / 1024).toFixed(0)} KB)`;
      st.textContent = ''; st.appendChild(a);
    } catch (e) {
      st.className = 'st err'; st.textContent = e.message || 'Failed';
    }
  }
  refresh();
};

clr.onclick = () => {
  items.forEach(i => i.url && URL.revokeObjectURL(i.url));
  items = [];
  list.innerHTML = '';
  refresh();
};

function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

const crcT = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u) { let c = 0xffffffff; for (let i = 0; i < u.length; i++) c = crcT[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], cd = [];
  let off = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(12, 0x21, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(14, 0x21, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    cd.push(c.buffer, name);
    off += 30 + name.length + data.length;
  }
  const cdSize = cd.reduce((s, b) => s + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cd, e.buffer], { type: 'application/zip' });
}

dl.onclick = async () => {
  const done = items.filter(i => i.out);
  if (!done.length) return;
  if (done.length === 1) return save(done[0].out.blob, done[0].out.name);
  dl.disabled = true;
  try {
    const files = done.map(i => ({ name: i.out.name, blob: i.out.blob }));
    save(await makeZip(files), 'converted-files.zip');
  } finally { refresh(); }
};
</script>
</body>
</html>
